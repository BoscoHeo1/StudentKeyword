name: Deploy production manually

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate access first; deploy requires the exact main SHA below'
        required: true
        type: choice
        options: [validate, deploy]
        default: validate
      confirm_sha:
        description: 'For deploy, enter the complete current main commit SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: studentkeyword-production-deploy
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main' && github.repository == 'BoscoHeo1/StudentKeyword'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm main commit and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: |
          node scripts/preflight-production.mjs
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: mykeyword-a832f
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Validate current production access
        run: bash scripts/deploy-production.sh validate
      - name: Build and deploy verified commit
        if: inputs.mode == 'deploy'
        run: bash scripts/deploy-production.sh deploy
