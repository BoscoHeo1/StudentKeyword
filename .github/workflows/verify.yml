name: Verify source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: Build and regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject forbidden tracked files
        run: node scripts/check-repository-files.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Security regression
        run: node tests/phase52-security.cjs
      - name: AI feedback regression
        run: node --test tests/ai-feedback-regression.mjs
      - name: Request limit regression
        run: node --test tests/request-limit.mjs
      - name: Deployment safety regression (mock GCP commands only)
        run: node --test tests/deployment-regression.mjs
      - name: Production source preflight regression (mock GitHub responses only)
        run: node --test tests/preflight-production.mjs
      - name: Teacher confirmation frontend regression (mock APIs only)
        run: node --test tests/frontend-class-auth.mjs
      - name: Hosting safety regression (mock commands/APIs only)
        run: node --test tests/hosting-regression.mjs
      - name: Verify new Hosting build artifact
        run: node scripts/deploy-hosting.mjs artifact
      - name: Validate workflow YAML and inline shell syntax
        run: |
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].each { |p| YAML.load_file(p); puts "YAML PASS: #{p}" }'
          python3 - <<'PY'
          import pathlib, subprocess
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              blocks = []
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.strip() == 'run: |':
                      indent = len(line) - len(line.lstrip())
                      block = []
                      for candidate in lines[i + 1:]:
                          if candidate.strip() and len(candidate) - len(candidate.lstrip()) <= indent:
                              break
                          block.append(candidate[indent + 2:])
                      blocks.append('\n'.join(block))
              for block in blocks:
                  subprocess.run(['bash', '-n'], input=block, text=True, check=True)
              print(f'Inline shell PASS: {path}')
          PY
          bash -n scripts/deploy-production.sh
          git ls-files -z '*.mjs' '*.cjs' | xargs -0 -r -n1 node --check
          git diff --check

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Gitleaks directory and full history
        run: |
          gitleaks dir . --redact --no-banner
          gitleaks git . --log-opts=--all --redact --no-banner
